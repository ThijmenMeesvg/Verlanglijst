<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://*.firebasedatabase.app; connect-src 'self' https://*.firebasedatabase.app wss://*.firebasedatabase.app; img-src 'self' https: data:; style-src 'self'; font-src 'self'; frame-src https://*.firebasedatabase.app; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Verlanglijst van Thijmen</title>
  <meta name="description" content="Mijn verlanglijst: zoek iets uit en klik op ‘Ik geef dit’, dan weet iedereen dat het al geregeld is.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Verlanglijst van Thijmen">
  <meta property="og:description" content="Zoek iets uit en klik op ‘Ik geef dit’, dan krijgt Thijmen niets dubbel.">
  <meta property="og:image" content="https://thijmenmeesvg.github.io/Verlanglijst/assets/og-image.png">
  <meta property="og:url" content="https://thijmenmeesvg.github.io/Verlanglijst/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1e3b2f">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/tag.css">
  <link rel="stylesheet" href="css/public.css">
  <script type="module" src="js/public/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#lijst">Naar de lijst</a>

  <header class="topbar">
    <a class="topbar__brand" href="./"><span aria-hidden="true">🎁</span> Verlanglijst</a>
    <button type="button" class="btn btn--small btn--quiet" id="share">Link delen</button>
  </header>

  <main>
    <section class="hero" aria-labelledby="title">
      <h1 id="title">Verlanglijst van Thijmen</h1>
      <p class="hero__intro" id="intro"></p>
      <ol class="steps">
        <li><span>Zoek iets uit dat je wilt geven.</span></li>
        <li><span>Klik op <strong>Ik geef dit</strong>.</span></li>
        <li><span>Iedereen ziet dat het geregeld is, dus niets komt dubbel.</span></li>
      </ol>
    </section>

    <section class="favorites" id="favorites-section" aria-labelledby="favorites-title" hidden>
      <h2 id="favorites-title">Wat ik het liefst wil</h2>
      <div class="favorites__row" id="favorites"></div>
    </section>

    <section class="wishes" id="lijst" aria-labelledby="wishes-title">
      <div class="wishes__head">
        <h2 id="wishes-title">Alle wensen</h2>
        <p class="wishes__count" id="count" aria-live="polite"></p>
      </div>

      <div class="toolbar">
        <div class="toolbar__row">
          <label class="visually-hidden" for="search">Zoeken</label>
          <input class="input toolbar__search" id="search" type="search" placeholder="Zoek in de lijst" autocomplete="off">
          <label class="visually-hidden" for="sort">Sorteren</label>
          <select class="select toolbar__sort" id="sort"></select>
        </div>
        <div class="chips" id="category-chips" role="group" aria-label="Categorie"></div>
        <div class="toolbar__row toolbar__row--wrap">
          <div class="chips" id="price-chips" role="group" aria-label="Prijs"></div>
          <label class="check toolbar__hide">
            <input type="checkbox" id="hide-claimed"> Verberg wat al gegeven wordt
          </label>
        </div>
      </div>

      <div class="grid" id="items" aria-busy="true">
        <p class="notice">De lijst wordt geladen…</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Gemaakt door Thijmen. <a href="admin.html">Beheer</a></p>
  </footer>
</body>
</html>
